<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Animated project radar for Elvin Omondi Juma">
<defs>
  <radialGradient id="bg" cx=".5" cy=".5" r=".75">
    <stop offset="0%" stop-color="#0A2034"/>
    <stop offset="65%" stop-color="#07111E"/>
    <stop offset="100%" stop-color="#040811"/>
  </radialGradient>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0%" stop-color="#22D3EE"/><stop offset="50%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#bg)" stroke="#38BDF8" stroke-opacity=".18"/>
<g transform="translate(600 170)" fill="none">
  <circle r="132" stroke="#38BDF8" stroke-opacity=".11"/>
  <circle r="94" stroke="#38BDF8" stroke-opacity=".13"/>
  <circle r="56" stroke="#A78BFA" stroke-opacity=".16"/>
  <path d="M-150 0H150M0-150V150" stroke="#334155" stroke-opacity=".22"/>
  <path d="M0 0L0-142" stroke="url(#g)" stroke-width="2" stroke-opacity=".65" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.2s" repeatCount="indefinite"/>
  </path>
  <path d="M0 0 A142 142 0 0 1 100.4 -100.4 L0 0Z" fill="#38BDF8" fill-opacity=".035">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.2s" repeatCount="indefinite"/>
  </path>
  <circle r="8" fill="#071426" stroke="url(#g)" stroke-width="2"/>
  <circle r="3.5" fill="#E0F2FE" filter="url(#glow)"/>
</g>

<g stroke="#38BDF8" stroke-opacity=".22" stroke-dasharray="4 8">
  <path d="M600 170L250 88"/><path d="M600 170L232 246"/><path d="M600 170L950 82"/><path d="M600 170L970 247"/><path d="M600 170L410 275"/><path d="M600 170L800 275"/>
</g>

<g font-family="ui-sans-serif,system-ui" font-weight="800">
  <g transform="translate(250 88)">
    <circle r="10" fill="#071426" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"><animate attributeName="r" values="8;12;8" dur="2.8s" repeatCount="indefinite"/></circle>
    <text x="18" y="5" fill="#D7F4FF" font-size="14">AETHER PHARMACY</text>
  </g>
  <g transform="translate(232 246)">
    <circle r="9" fill="#071426" stroke="#34D399" stroke-width="2" filter="url(#glow)"><animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="18" y="5" fill="#D1FAE5" font-size="14">JUSTINTIME</text>
  </g>
  <g transform="translate(950 82)">
    <circle r="9" fill="#071426" stroke="#60A5FA" stroke-width="2" filter="url(#glow)"><animate attributeName="r" values="8;11;8" dur="3.1s" repeatCount="indefinite"/></circle>
    <text x="-18" y="5" text-anchor="end" fill="#DBEAFE" font-size="14">RESTAURANT MANAGER</text>
  </g>
  <g transform="translate(970 247)">
    <circle r="9" fill="#071426" stroke="#A78BFA" stroke-width="2" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <text x="-18" y="5" text-anchor="end" fill="#E9D5FF" font-size="14">KAMPUS</text>
  </g>
  <g transform="translate(410 275)">
    <circle r="8" fill="#071426" stroke="#22D3EE" stroke-width="2"/>
    <text x="0" y="29" text-anchor="middle" fill="#BAE6FD" font-size="13">CONCEPT BUILDERS</text>
  </g>
  <g transform="translate(800 275)">
    <circle r="8" fill="#071426" stroke="#A78BFA" stroke-width="2"/>
    <text x="0" y="29" text-anchor="middle" fill="#DDD6FE" font-size="13">GERMAN VIRTUAL SCHOOL</text>
  </g>
</g>

<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <text x="42" y="38" fill="#64748B" font-size="12" font-weight="700" letter-spacing="1.7">PROJECT CONSTELLATION / LIVE SYSTEM MAP</text>
  <text x="1158" y="38" text-anchor="end" fill="#34D399" font-size="11">6 SYSTEMS ONLINE</text>
  <text x="600" y="174" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="800">GTSS</text>
</g>
</svg>