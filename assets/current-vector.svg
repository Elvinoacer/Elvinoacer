<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Animated current vector telemetry">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06111F"/><stop offset="100%" stop-color="#0B0D1A"/></linearGradient>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0%" stop-color="#22D3EE"/><stop offset="50%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="1198" height="218" rx="24" fill="url(#bg)" stroke="#38BDF8" stroke-opacity=".18"/>
<g font-family="ui-sans-serif,system-ui">
  <text x="42" y="40" fill="#64748B" font-size="12" font-weight="800" letter-spacing="1.8">CURRENT VECTOR / TELEMETRY</text>
  <g transform="translate(42 72)">
    <circle cx="8" cy="8" r="5" fill="#34D399" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="26" y="13" fill="#D1FAE5" font-size="14" font-weight="700">BUILDING</text>
    <text x="132" y="13" fill="#94A3B8" font-size="14">healthcare · pharmacy · marketplaces · operational platforms</text>
  </g>
  <g transform="translate(42 120)">
    <circle cx="8" cy="8" r="5" fill="#38BDF8" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="26" y="13" fill="#BAE6FD" font-size="14" font-weight="700">DEEPENING</text>
    <text x="142" y="13" fill="#94A3B8" font-size="14">system design · reliability · multi-tenancy · AI-assisted engineering</text>
  </g>
  <g transform="translate(42 168)">
    <circle cx="8" cy="8" r="5" fill="#A78BFA" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <text x="26" y="13" fill="#E9D5FF" font-size="14" font-weight="700">SEEKING</text>
    <text x="118" y="13" fill="#94A3B8" font-size="14">hard product problems · technical collaborations · systems with operational depth</text>
  </g>
</g>
<g transform="translate(1035 110)">
  <circle r="62" fill="none" stroke="#38BDF8" stroke-opacity=".13" stroke-width="8"/>
  <circle r="62" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="120 270" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="43" fill="none" stroke="#A78BFA" stroke-opacity=".25" stroke-dasharray="5 10">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <text text-anchor="middle" y="-4" fill="#F8FAFC" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="800">FORWARD</text>
  <text text-anchor="middle" y="17" fill="#64748B" font-family="ui-monospace,monospace" font-size="10">VECTOR</text>
</g>
<path d="M870 185H1148" stroke="#334155" stroke-opacity=".25"/>
<path d="M870 185H1148" stroke="url(#g)" stroke-width="2" stroke-dasharray="30 75">
  <animate attributeName="stroke-dashoffset" values="0;-210" dur="3s" repeatCount="indefinite"/>
</path>
</svg>