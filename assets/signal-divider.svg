<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="Animated signal divider">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
    <stop offset="35%" stop-color="#22D3EE" stop-opacity=".75"/>
    <stop offset="65%" stop-color="#A78BFA" stop-opacity=".75"/>
    <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="72" fill="#030711" fill-opacity=".001"/>
<path d="M40 36H1160" stroke="#334155" stroke-opacity=".28"/>
<path d="M40 36H1160" stroke="url(#g)" stroke-width="2" stroke-dasharray="80 260" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" values="0;-680" dur="4.2s" repeatCount="indefinite"/>
</path>
<g fill="#67E8F9" filter="url(#glow)">
  <circle r="3"><animateMotion path="M40 36H1160" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle r="2.2" opacity=".7"><animateMotion path="M40 36H1160" dur="4.2s" begin="-1.4s" repeatCount="indefinite"/></circle>
  <circle r="2.2" fill="#C084FC" opacity=".8"><animateMotion path="M40 36H1160" dur="4.2s" begin="-2.8s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(600 36)">
  <circle r="8" fill="#071426" stroke="#38BDF8" stroke-opacity=".5"/>
  <circle r="2.8" fill="#E0F2FE">
    <animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="16" fill="none" stroke="#38BDF8" stroke-opacity=".18">
    <animate attributeName="r" values="12;24;12" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".35;0;.35" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>