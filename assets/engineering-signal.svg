<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Animated engineering systems panel">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111F"/>
    <stop offset="100%" stop-color="#0B1020"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="50%" stop-color="#60A5FA"/>
    <stop offset="100%" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="1198" height="208" rx="24" fill="url(#bg)" stroke="#38BDF8" stroke-opacity=".18"/>
<g font-family="ui-sans-serif,system-ui" font-size="13" font-weight="700" letter-spacing="1.2">
  <text x="44" y="38" fill="#64748B">LIVE ENGINEERING SIGNAL</text>
  <text x="1110" y="38" fill="#34D399" text-anchor="end">ACTIVE</text>
</g>
<g stroke="#334155" stroke-opacity=".34">
  <path d="M44 70H1156"/><path d="M44 116H1156"/><path d="M44 162H1156"/>
</g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
  <text x="46" y="94" fill="#BAE6FD">PRODUCT SYSTEMS</text>
  <text x="46" y="140" fill="#BAE6FD">REAL-TIME + OFFLINE</text>
  <text x="46" y="186" fill="#E9D5FF">AI-ASSISTED DELIVERY</text>
</g>
<g>
  <rect x="285" y="82" width="0" height="8" rx="4" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="width" values="0;760;520;760" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="285" y="128" width="0" height="8" rx="4" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="width" values="140;650;430;650" dur="6.2s" begin="-1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="285" y="174" width="0" height="8" rx="4" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="width" values="80;820;600;820" dur="4.8s" begin="-2.1s" repeatCount="indefinite"/>
  </rect>
</g>
<g fill="#E0F2FE" filter="url(#glow)">
  <circle cy="86" r="4"><animate attributeName="cx" values="285;1045;805;1045" dur="5.5s" repeatCount="indefinite"/></circle>
  <circle cy="132" r="4"><animate attributeName="cx" values="425;935;715;935" dur="6.2s" begin="-1.2s" repeatCount="indefinite"/></circle>
  <circle cy="178" r="4" fill="#E9D5FF"><animate attributeName="cx" values="365;1105;885;1105" dur="4.8s" begin="-2.1s" repeatCount="indefinite"/></circle>
</g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#64748B">
  <text x="1100" y="94" text-anchor="end">architecture → delivery</text>
  <text x="1100" y="140" text-anchor="end">resilience → state → sync</text>
  <text x="1100" y="186" text-anchor="end">research → build → verify</text>
</g>
</svg>