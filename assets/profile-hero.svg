<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Elvin Omondi Juma — Full-Stack Product Engineer</title>
  <desc id="desc">GitHub profile banner for Elvin Omondi Juma, a full-stack product engineer in Nairobi, Kenya.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="45%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#0B1F36"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.2" r="0.9">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#8B5CF6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#8AB4F8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="380" rx="28" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#7DD3FC" stroke-opacity="0.13"/>
  <rect x="0" y="0" width="1200" height="380" rx="28" fill="url(#grid)"/>

  <g opacity="0.95">
    <circle cx="1020" cy="188" r="124" fill="none" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1.2"/>
    <circle cx="1020" cy="188" r="90" fill="none" stroke="#A78BFA" stroke-opacity="0.18" stroke-width="1.2"/>
    <circle cx="1020" cy="188" r="56" fill="none" stroke="#22D3EE" stroke-opacity="0.24" stroke-width="1.2"/>
    <path d="M898 188 C930 96 1112 96 1142 188 C1112 280 930 280 898 188Z" fill="none" stroke="url(#accent)" stroke-opacity="0.22" stroke-width="1.1"/>
    <circle cx="1108" cy="113" r="4" fill="#22D3EE"/>
    <circle cx="947" cy="258" r="3" fill="#A78BFA"/>
    <circle cx="1020" cy="188" r="7" fill="#E2F7FF"/>
    <circle cx="1020" cy="188" r="22" fill="#38BDF8" opacity="0.08" filter="url(#blur)"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(64 48)">
      <rect width="174" height="32" rx="16" fill="#0B2239" stroke="#22D3EE" stroke-opacity="0.28"/>
      <circle cx="19" cy="16" r="4.5" fill="#34D399"/>
      <text x="33" y="21" fill="#CFFAFE" font-size="13" font-weight="600" letter-spacing="1.2">NAIROBI · KENYA</text>
    </g>

    <text x="64" y="142" fill="#F8FAFC" font-size="48" font-weight="800" letter-spacing="-1.4">ELVIN OMONDI JUMA</text>
    <rect x="64" y="164" width="510" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="212" fill="#BAE6FD" font-size="19" font-weight="700" letter-spacing="2.2">FULL-STACK PRODUCT ENGINEER</text>
    <text x="64" y="250" fill="#94A3B8" font-size="17" font-weight="500">Building reliable software for real businesses, real users, and real constraints.</text>

    <g transform="translate(64 292)">
      <rect width="145" height="38" rx="19" fill="#0B1D31" stroke="#38BDF8" stroke-opacity="0.20"/>
      <text x="20" y="25" fill="#D7F4FF" font-size="14" font-weight="650">Product systems</text>

      <g transform="translate(158 0)">
        <rect width="136" height="38" rx="19" fill="#0B1D31" stroke="#38BDF8" stroke-opacity="0.20"/>
        <text x="20" y="25" fill="#D7F4FF" font-size="14" font-weight="650">Real-time apps</text>
      </g>

      <g transform="translate(307 0)">
        <rect width="139" height="38" rx="19" fill="#0B1D31" stroke="#A78BFA" stroke-opacity="0.22"/>
        <text x="20" y="25" fill="#EDE9FE" font-size="14" font-weight="650">AI workflows</text>
      </g>

      <g transform="translate(459 0)">
        <rect width="140" height="38" rx="19" fill="#0B1D31" stroke="#34D399" stroke-opacity="0.20"/>
        <text x="20" y="25" fill="#D1FAE5" font-size="14" font-weight="650">Africa-first UX</text>
      </g>
    </g>

    <text x="1020" y="195" text-anchor="middle" fill="#F8FAFC" font-size="25" font-weight="800" letter-spacing="1.5">EOJ</text>
    <text x="1134" y="342" text-anchor="end" fill="#64748B" font-size="12" font-weight="600" letter-spacing="1.6">SHIP · LEARN · ITERATE</text>
